<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password – StudeCo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <a href="/" class="logo" style="justify-content:center;margin-bottom:1.5rem;">
        <span class="logo-icon">S</span>
        <span>StudeCo</span>
      </a>
      <h1>Reset password</h1>
      <p class="text-secondary text-center" style="margin-bottom:1.5rem;">Enter your email and we’ll send a reset link.</p>
      <div id="alert" class="alert hidden" role="alert"></div>
      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="submitBtn">Send reset link</button>
      </form>
      <p class="text-center text-sm text-secondary" style="margin-top:1.5rem;">
        <a href="/login.html">Back to sign in</a>
      </p>
    </div>
  </div>
  <script type="module">
    import { getSupabase } from '/js/supabase-client.js';
    const form = document.getElementById('resetForm');
    const alertEl = document.getElementById('alert');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      const email = document.getElementById('email').value.trim();
      const supabase = getSupabase();
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password.html'
      });
      if (error) {
        alertEl.textContent = error.message;
        alertEl.className = 'alert alert-danger';
      } else {
        alertEl.textContent = 'If an account exists for that email, a reset link has been sent.';
        alertEl.className = 'alert alert-success';
      }
      alertEl.classList.remove('hidden');
      btn.disabled = false;
    });
  </script>
</body>
</html>
