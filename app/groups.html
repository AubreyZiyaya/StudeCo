<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groups – StudeCo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="/app/" class="logo"><span class="logo-icon">S</span><span>StudeCo</span></a>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost" id="signOutBtn" style="width:100%;">Sign out</button>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon mobile-sidebar-btn" id="sidebarToggle" aria-label="Menu">☰</button>
        <h2 class="topbar-title">Groups</h2>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon" id="themeToggle">🌓</button>
          <span class="avatar" id="userAvatar">?</span>
        </div>
      </header>
      <main class="content" style="max-width:900px;">
        <div class="page-header flex justify-between items-center" style="margin-bottom:1.5rem;">
          <div>
            <h1 style="font-size:1.5rem;">Groups</h1>
            <p class="text-secondary text-sm">Join study groups, clubs and academic communities</p>
          </div>
          <button class="btn btn-primary" id="createGroupBtn">+ Create group</button>
        </div>

        <div class="tabs" id="groupTabs">
          <button class="tab active" data-tab="discover">Discover</button>
          <button class="tab" data-tab="my">My groups</button>
        </div>

        <div class="search-bar" style="margin:1rem 0;">
          <input type="search" class="form-input" id="groupSearch" placeholder="Search groups…">
        </div>

        <div id="groupsList" class="groups-grid"></div>
        <div id="groupsEmpty" class="empty-state hidden">
          <h3>No groups found</h3>
          <p class="text-muted">Create one or try a different search.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div class="modal-overlay hidden" id="createModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create a group</h3>
        <button class="btn btn-ghost btn-icon" id="closeModal">×</button>
      </div>
      <form id="createGroupForm">
        <div class="form-group">
          <label class="form-label">Group name *</label>
          <input type="text" id="gName" class="form-input" required maxlength="80" placeholder="e.g. Form 4 Physics">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="gDesc" class="form-textarea" rows="3" maxlength="500"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Visibility</label>
          <select id="gType" class="form-select">
            <option value="public">Public – anyone can join</option>
            <option value="private">Private – approval required</option>
            <option value="institution_restricted">Institution restricted</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Education level</label>
          <select id="gEdu" class="form-select">
            <option value="both">Both</option>
            <option value="secondary">Secondary</option>
            <option value="university">University</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelCreate">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { getSupabase } from '/js/supabase-client.js';
    import { initShell, renderSidebarNav } from '/js/components/shell.js';
    import { escapeHtml, formatRelative, showToast } from '/js/utils/dom.js';

    document.getElementById('sidebarNav').innerHTML = renderSidebarNav('groups');
    const { user, profile } = await initShell('groups');
    const supabase = getSupabase();

    let currentTab = 'discover';
    let myGroupIds = new Set();

    async function loadMyMemberships() {
      const { data } = await supabase
        .from('group_memberships')
        .select('group_id')
        .eq('user_id', user.id)
        .eq('status', 'active');
      myGroupIds = new Set((data || []).map(m => m.group_id));
    }

    async function loadGroups(search = '') {
      const list = document.getElementById('groupsList');
      list.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';

      await loadMyMemberships();

      let query = supabase
        .from('groups')
        .select('id, name, description, group_type, education_level, member_count, avatar_url, created_at, is_verified')
        .eq('is_suspended', false)
        .order('member_count', { ascending: false })
        .limit(40);

      if (search) query = query.ilike('name', `%${search}%`);

      const { data, error } = await query;
      if (error) {
        list.innerHTML = `<div class="alert alert-danger">${escapeHtml(error.message)}</div>`;
        return;
      }

      let groups = data || [];
      if (currentTab === 'my') {
        groups = groups.filter(g => myGroupIds.has(g.id));
      }

      document.getElementById('groupsEmpty').classList.toggle('hidden', groups.length > 0);

      list.innerHTML = groups.map(g => {
        const isMember = myGroupIds.has(g.id);
        return `
          <article class="card group-card">
            <div class="card-body">
              <div class="flex items-center gap-3" style="margin-bottom:0.75rem;">
                <div class="group-avatar">${escapeHtml((g.name || '?')[0].toUpperCase())}</div>
                <div style="flex:1;min-width:0;">
                  <a href="/app/group.html?id=${g.id}" class="font-semibold" style="color:inherit;">${escapeHtml(g.name)}</a>
                  ${g.is_verified ? '<span class="badge badge-info" style="margin-left:0.35rem;">Verified</span>' : ''}
                  <div class="text-muted text-xs">${escapeHtml(g.group_type)} · ${g.member_count || 0} members</div>
                </div>
              </div>
              <p class="text-secondary text-sm" style="margin-bottom:0.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                ${escapeHtml(g.description || 'No description')}
              </p>
              <div class="flex justify-between items-center">
                <span class="badge">${escapeHtml(g.education_level || 'both')}</span>
                ${isMember
                  ? `<a href="/app/group.html?id=${g.id}" class="btn btn-secondary btn-sm">Open</a>`
                  : `<button class="btn btn-primary btn-sm join-btn" data-id="${g.id}" data-type="${g.group_type}">Join</button>`
                }
              </div>
            </div>
          </article>
        `;
      }).join('');

      list.querySelectorAll('.join-btn').forEach(btn => {
        btn.addEventListener('click', () => joinGroup(btn.dataset.id, btn.dataset.type));
      });
    }

    async function joinGroup(groupId, type) {
      const status = type === 'private' ? 'pending' : 'active';
      const { error } = await supabase.from('group_memberships').insert({
        group_id: groupId,
        user_id: user.id,
        role: 'member',
        status
      });
      if (error) {
        if (error.code === '23505') showToast('Already a member or request pending', 'warning');
        else showToast(error.message, 'error');
        return;
      }
      // Increment member count for public joins
      if (status === 'active') {
        await supabase.rpc('increment_group_members', { gid: groupId }).catch(() => {});
      }
      showToast(status === 'pending' ? 'Membership requested' : 'Joined group!', 'success');
      loadGroups(document.getElementById('groupSearch').value);
    }

    // Tabs
    document.getElementById('groupTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      loadGroups(document.getElementById('groupSearch').value);
    });

    document.getElementById('groupSearch').addEventListener('input', (e) => {
      clearTimeout(window._gs);
      window._gs = setTimeout(() => loadGroups(e.target.value.trim()), 300);
    });

    // Create modal
    const modal = document.getElementById('createModal');
    document.getElementById('createGroupBtn').onclick = () => modal.classList.remove('hidden');
    document.getElementById('closeModal').onclick = () => modal.classList.add('hidden');
    document.getElementById('cancelCreate').onclick = () => modal.classList.add('hidden');

    document.getElementById('createGroupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('gName').value.trim();
      const description = document.getElementById('gDesc').value.trim();
      const group_type = document.getElementById('gType').value;
      const education_level = document.getElementById('gEdu').value;

      const { data, error } = await supabase.from('groups').insert({
        name, description, group_type, education_level,
        created_by: user.id,
        member_count: 1
      }).select().single();

      if (error) {
        showToast(error.message, 'error');
        return;
      }

      await supabase.from('group_memberships').insert({
        group_id: data.id,
        user_id: user.id,
        role: 'admin',
        status: 'active'
      });

      showToast('Group created!', 'success');
      modal.classList.add('hidden');
      e.target.reset();
      loadGroups();
    });

    loadGroups();
  </script>
  <style>
    .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .group-avatar {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-700));
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.25rem; flex-shrink: 0;
    }
    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 0.625rem 1rem; border: none; background: none; cursor: pointer;
      font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--primary-600); border-bottom-color: var(--primary-600); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal {
      background: var(--bg); border-radius: var(--radius-xl); width: 100%; max-width: 440px;
      box-shadow: var(--shadow-xl); padding: 1.5rem;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem; }
    .topbar-title { font-size: 1.125rem; margin: 0; flex: 1; }
  </style>
</body>
</html>
