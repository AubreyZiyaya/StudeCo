<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources | StudeCo</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">S</span>
          <span>StudeCo</span>
        </div>
        <nav class="sidebar-nav">
          <a href="feed.html">Home</a>
          <a href="groups.html">Groups</a>
          <a class="active" href="resources.html">Resources</a>
          <a href="messages.html">Messages</a>
          <a href="notifications.html">Notifications</a>
          <a href="events.html">Events</a>
          <a href="opportunities.html">Opportunities</a>
          <a href="profile.html">Profile</a>
          <a href="settings.html">Settings</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="search-box">
            <input type="search" placeholder="Search resources, notes, documents..." />
          </div>
          <div class="topbar-actions">
            <button class="btn btn-primary">Upload resource</button>
          </div>
        </header>

        <section class="page-shell">
          <div class="card">
            <h1>Academic resource centre</h1>
            <div class="resource-grid">
              <article class="resource-item card mini">
                <h3>Algorithms revision guide</h3>
                <p>PDF • CS210</p>
                <button class="btn btn-secondary" type="button">Open</button>
              </article>
              <article class="resource-item card mini">
                <h3>Research methods cheat sheet</h3>
                <p>PDF • Research</p>
                <button class="btn btn-secondary" type="button">Open</button>
              </article>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
