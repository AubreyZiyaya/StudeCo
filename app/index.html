<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudeCo App</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">S</span>
          <span>StudeCo</span>
        </div>
        <nav class="sidebar-nav">
          <a class="active" href="feed.html">Home</a>
          <a href="profile.html">Profile</a>
          <a href="groups.html">Groups</a>
          <a href="resources.html">Resources</a>
          <a href="messages.html">Messages</a>
          <a href="notifications.html">Notifications</a>
          <a href="events.html">Events</a>
          <a href="opportunities.html">Opportunities</a>
          <a href="settings.html">Settings</a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="search-box">
            <input type="search" placeholder="Search students, groups, resources..." />
          </div>
          <div class="topbar-actions">
            <button class="btn btn-secondary">Notifications</button>
            <button class="btn btn-primary">Create post</button>
          </div>
        </header>

        <section class="page-shell">
          <h1>Dashboard</h1>
          <div class="card-grid">
            <div class="info-card"><strong>47</strong><span>Friends</span></div>
            <div class="info-card"><strong>12</strong><span>Groups</span></div>
            <div class="info-card"><strong>8</strong><span>Resources</span></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
