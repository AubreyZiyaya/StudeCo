<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities – StudeCo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><a href="/app/" class="logo"><span class="logo-icon">S</span><span>StudeCo</span></a></div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer"><button class="btn btn-ghost" id="signOutBtn" style="width:100%;">Sign out</button></div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon mobile-sidebar-btn" id="sidebarToggle">☰</button>
        <h2 style="font-size:1.125rem;margin:0;flex:1;">Opportunities</h2>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" id="postOppBtn">+ Post</button>
          <button class="btn btn-ghost btn-icon" id="themeToggle">🌓</button>
          <span class="avatar" id="userAvatar">?</span>
        </div>
      </header>
      <main class="content" style="max-width:800px;">
        <div class="flex gap-2" style="margin-bottom:1rem;flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm filter-btn active" data-type="">All</button>
          <button class="btn btn-secondary btn-sm filter-btn" data-type="scholarship">Scholarships</button>
          <button class="btn btn-secondary btn-sm filter-btn" data-type="internship">Internships</button>
          <button class="btn btn-secondary btn-sm filter-btn" data-type="job">Jobs</button>
          <button class="btn btn-secondary btn-sm filter-btn" data-type="competition">Competitions</button>
        </div>
        <div id="oppList"></div>
      </main>
    </div>
  </div>
  <div class="modal-overlay hidden" id="oppModal">
    <div class="modal" style="max-width:480px;background:var(--bg);border-radius:var(--radius-xl);padding:1.5rem;box-shadow:var(--shadow-xl);">
      <div style="display:flex;justify-content:space-between;margin-bottom:1rem;">
        <h3>Post opportunity</h3>
        <button class="btn btn-ghost btn-icon" id="closeOppModal">×</button>
      </div>
      <form id="oppForm">
        <div class="form-group"><label class="form-label">Title *</label><input id="oppTitle" class="form-input" required></div>
        <div class="form-group"><label class="form-label">Description</label><textarea id="oppDesc" class="form-textarea" rows="3"></textarea></div>
        <div class="form-group"><label class="form-label">Type</label>
          <select id="oppType" class="form-select">
            <option value="scholarship">Scholarship</option>
            <option value="internship">Internship</option>
            <option value="job">Job</option>
            <option value="competition">Competition</option>
            <option value="mentorship">Mentorship</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Organization</label><input id="oppOrg" class="form-input"></div>
        <div class="form-group"><label class="form-label">Application URL</label><input type="url" id="oppUrl" class="form-input" placeholder="https://"></div>
        <div class="form-group"><label class="form-label">Deadline</label><input type="date" id="oppDeadline" class="form-input"></div>
        <div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1rem;">
          <button type="button" class="btn btn-secondary" id="cancelOpp">Cancel</button>
          <button type="submit" class="btn btn-primary">Post</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module">
    import { getSupabase } from '/js/supabase-client.js';
    import { initShell, renderSidebarNav } from '/js/components/shell.js';
    import { escapeHtml, formatDate, showToast } from '/js/utils/dom.js';

    document.getElementById('sidebarNav').innerHTML = renderSidebarNav('opportunities');
    const { user } = await initShell('opportunities');
    const supabase = getSupabase();
    let filterType = '';

    async function load() {
      const list = document.getElementById('oppList');
      let q = supabase.from('opportunities').select('*').eq('is_approved', true).order('created_at', { ascending: false }).limit(40);
      if (filterType) q = q.eq('opportunity_type', filterType);
      const { data, error } = await q;
      if (error) { list.innerHTML = `<div class="alert alert-danger">${escapeHtml(error.message)}</div>`; return; }
      if (!data?.length) {
        list.innerHTML = '<div class="empty-state"><h3>No opportunities</h3><p class="text-muted">Check back later or post one.</p></div>';
        return;
      }
      list.innerHTML = data.map(o => `
        <article class="card" style="margin-bottom:0.75rem;">
          <div class="card-body">
            <span class="badge badge-info">${escapeHtml(o.opportunity_type)}</span>
            <h3 style="font-size:1.0625rem;margin:0.35rem 0;">${escapeHtml(o.title)}</h3>
            <p class="text-secondary text-sm">${escapeHtml(o.description || '')}</p>
            <div class="text-sm text-muted" style="margin-top:0.5rem;">
              ${o.organization ? escapeHtml(o.organization) + ' · ' : ''}
              ${o.deadline ? 'Deadline: ' + formatDate(o.deadline) : ''}
            </div>
            ${o.application_url ? `<a href="${escapeHtml(o.application_url)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm" style="margin-top:0.75rem;">Apply</a>` : ''}
          </div>
        </article>
      `).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterType = btn.dataset.type;
        load();
      });
    });

    const modal = document.getElementById('oppModal');
    document.getElementById('postOppBtn').onclick = () => modal.classList.remove('hidden');
    document.getElementById('closeOppModal').onclick = () => modal.classList.add('hidden');
    document.getElementById('cancelOpp').onclick = () => modal.classList.add('hidden');

    document.getElementById('oppForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('oppUrl').value.trim();
      if (url && !url.startsWith('https://') && !url.startsWith('http://')) {
        showToast('Application URL should start with https://', 'warning');
        return;
      }
      const { error } = await supabase.from('opportunities').insert({
        poster_id: user.id,
        title: document.getElementById('oppTitle').value.trim(),
        description: document.getElementById('oppDesc').value.trim() || null,
        opportunity_type: document.getElementById('oppType').value,
        organization: document.getElementById('oppOrg').value.trim() || null,
        application_url: url || null,
        deadline: document.getElementById('oppDeadline').value || null
      });
      if (error) showToast(error.message, 'error');
      else { showToast('Posted!', 'success'); modal.classList.add('hidden'); e.target.reset(); load(); }
    });

    load();
  </script>
  <style>
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
    .filter-btn.active{background:var(--primary-100);color:var(--primary-700);border-color:var(--primary-300);}
  </style>
</body>
</html>
