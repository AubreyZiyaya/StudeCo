<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | StudeCo</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark">S</span>
          <span>StudeCo</span>
        </div>
        <h1>Welcome back</h1>
        <p>Sign in to continue learning and connecting.</p>

        <form id="login-form" class="auth-form">
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit" class="btn btn-primary full">Sign in</button>
        </form>

        <div class="form-secondary-links">
          <a href="forgot-password.html">Forgot password?</a>
          <a href="register.html">Create an account</a>
        </div>

        <div id="auth-message" class="form-message"></div>
      </div>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
