<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload & Storage | StudeCo Admin</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar">
      <div class="brand">
        <span class="brand-mark">S</span>
        <span>StudeCo Admin</span>
      </div>
      <nav>
        <a href="index.html">Overview</a>
        <a class="active" href="uploads.html">Upload & storage</a>
        <a href="settings.html">Platform</a>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Upload & Storage</h1>
      </header>

      <section class="card admin-form">
        <h2>Upload availability</h2>
        <label>
          Global uploads enabled
          <input type="checkbox" checked />
        </label>
        <label>
          Max file size (MB)
          <input type="number" value="50" />
        </label>
        <label>
          Maintenance message title
          <input type="text" value="Uploads Temporarily Unavailable" />
        </label>
        <button class="btn btn-primary" type="button">Save settings</button>
      </section>
    </main>
  </body>
</html>
